name: CI

# Build and test validation for pushes and PRs to main. Compiles the Swift
# client (release config) via build.sh; no packaging, signing, or release.
# The tag-triggered release.yml produces the shippable unsigned pkg.

on:
  pull_request:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'build.sh'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'build.sh'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          # build.sh derives per-module versions from git history.
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      # build.sh's shebang is #!/opt/homebrew/bin/bash (bash 5). The runner ships
      # only system bash 3.2, so install the Homebrew bash the script expects.
      - name: Install bash 5
        run: brew list bash >/dev/null 2>&1 || brew install bash

      - name: Build (compile only, unsigned)
        run: ./build.sh --skip-pkg --skip-zip --skip-dmg

      # The pkg step is skipped above, so compile the Icon Composer bundle here
      # to catch an SDK that can't build Assets.car before a release does.
      - name: Compile app icon
        run: |
          out="$RUNNER_TEMP/actool-out"
          mkdir -p "$out"
          xcrun actool --version
          xcrun actool --compile "$out" --platform macosx \
            --minimum-deployment-target 14.0 --app-icon ReportMate \
            --output-partial-info-plist "$out/partial-info.plist" \
            --warnings --errors Resources/ReportMate.icon
          test -f "$out/Assets.car"

      - name: Test
        run: swift test
