name: Release

# Builds ReportMate-<version>.pkg, signs it with a Developer ID, notarizes and
# staples it, and publishes it as a GitHub release.
#
# The signing identity comes only from repository secrets. build.sh stays
# identity-agnostic and reads it from the environment, so anyone building from
# source signs with their own Developer ID and this release's identity never
# leaks into theirs.
#
# Required repository secrets:
#   DEVELOPER_ID_P12_BASE64     base64 of a .p12 holding both Developer ID
#                               identities (Application + Installer)
#   DEVELOPER_ID_P12_PASSWORD   that .p12's password
#   SIGNING_IDENTITY_APP        Developer ID Application: <Name> (<TeamID>)
#   SIGNING_IDENTITY_INSTALLER  Developer ID Installer: <Name> (<TeamID>)
#   NOTARY_KEY_BASE64           base64 of an App Store Connect API key .p8
#   NOTARY_KEY_ID               that key's ID
#   NOTARY_ISSUER_ID            the App Store Connect issuer UUID

on:
  push:
    tags:
      - 'v*'
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].[0-9][0-9][0-9][0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (leave empty for auto YYYY.MM.DD.HHMM)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    # Notarization for a young team can sit in Apple's queue for over an hour.
    timeout-minutes: 240
    env:
      NOTARIZATION_PROFILE: notary

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # build.sh derives per-module versions from git history.
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Cache SwiftPM
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      # Decide what to hand build.sh: a YYYY.MM.DD.HHMM version (from the tag or
      # the manual input) if it's well-formed, otherwise nothing so build.sh
      # auto-generates one.
      - name: Resolve version arg
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi
          if printf '%s' "$VERSION" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]{4}$'; then
            echo "arg=--version $VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "arg=" >> "$GITHUB_OUTPUT"
          fi

      # build.sh's shebang is #!/opt/homebrew/bin/bash (bash 5). The runner ships
      # only system bash 3.2, so install the Homebrew bash the script expects.
      - name: Install bash 5
        run: brew list bash >/dev/null 2>&1 || brew install bash

      - name: Import Developer ID certificates
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_password="$(uuidgen)"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certs.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$RUNNER_TEMP/certs.p12"

      - name: Store notarization credentials
        env:
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/notary.p8"
          echo "$NOTARY_KEY_BASE64" | base64 --decode > "$key"
          xcrun notarytool store-credentials "$NOTARIZATION_PROFILE" \
            --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$KEYCHAIN"
          rm "$key"

      # --distribution signs the app bundle with the hardened runtime and signs
      # the pkg. Notarization is done in the next step rather than with
      # --notarize, so the log shows its progress instead of sitting silent.
      - name: Build and sign pkg
        env:
          SIGNING_IDENTITY_APP: ${{ secrets.SIGNING_IDENTITY_APP }}
          SIGNING_IDENTITY_INSTALLER: ${{ secrets.SIGNING_IDENTITY_INSTALLER }}
        run: SIGNING_KEYCHAIN="$KEYCHAIN" ./build.sh ${{ steps.resolve.outputs.arg }} --skip-zip --skip-dmg --distribution

      # Before the checksum is taken: stapling rewrites the pkg.
      - name: Notarize and staple
        run: |
          set -euo pipefail
          pkg=$(ls -1 release/ReportMate-*.pkg | head -1)
          id=$(xcrun notarytool submit "$pkg" --keychain-profile "$NOTARIZATION_PROFILE" \
                 --keychain "$KEYCHAIN" --output-format json | jq -r .id)
          echo "Submitted $(basename "$pkg") as $id"
          deadline=$((SECONDS + 3 * 3600))
          while :; do
            status=$(xcrun notarytool info "$id" --keychain-profile "$NOTARIZATION_PROFILE" \
                       --keychain "$KEYCHAIN" --output-format json | jq -r .status)
            echo "$(date -u +%H:%M:%S) $status"
            case "$status" in
              Accepted) break ;;
              Invalid|Rejected)
                xcrun notarytool log "$id" --keychain-profile "$NOTARIZATION_PROFILE" --keychain "$KEYCHAIN"
                exit 1 ;;
            esac
            if [ "$SECONDS" -gt "$deadline" ]; then
              echo "::error::Still $status after 3 hours. Check later with: xcrun notarytool info $id"
              exit 1
            fi
            sleep 30
          done
          xcrun stapler staple "$pkg"
          spctl -a -vvv -t install "$pkg"

      - name: Capture build info
        id: info
        run: |
          set -euo pipefail
          PKG=$(ls -1 release/ReportMate-*.pkg 2>/dev/null | head -1)
          [ -n "$PKG" ] || { echo "No pkg produced by build.sh"; exit 1; }
          BASE=$(basename "$PKG")
          if ! printf '%s' "$BASE" | grep -Eq '^ReportMate-[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]{4}\.pkg$'; then
            echo "Unexpected pkg name: $BASE"; exit 1
          fi
          VERSION=$(printf '%s' "$BASE" | sed -E 's/^ReportMate-(.+)\.pkg$/\1/')
          ( cd release && shasum -a 256 "$BASE" > "$BASE.sha256" )
          {
            echo "version=$VERSION"
            echo "swift=$(swift --version 2>&1 | head -1)"
            echo "os=$(sw_vers -productName) $(sw_vers -productVersion)"
          } >> "$GITHUB_OUTPUT"

      - name: List release artifacts
        run: ls -lh release/ReportMate-*.pkg release/ReportMate-*.pkg.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.info.outputs.version }}
          SWIFT: ${{ steps.info.outputs.swift }}
          OS: ${{ steps.info.outputs.os }}
        run: |
          set -euo pipefail

          # On a tag push the tag already exists; on a manual run create it at
          # the built commit so the release has something to hang off.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$VERSION"
          else
            TAG="$REF_NAME"
          fi

          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          AUTO_NOTES=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" --jq .body)
          AUTO_NOTES=$(printf '%s\n' "$AUTO_NOTES" | sed -E -e 's/ by @[A-Za-z0-9_-]+ in / in /g' -e '/^#+ New Contributors/d' -e '/made their first contribution/d')

          # Assemble notes line-by-line. printf '%s\n' keeps each literal arg
          # verbatim (backticks/backslashes intact) and every line stays
          # indented inside the YAML block scalar -- a heredoc body cannot.
          NOTES_FILE="$RUNNER_TEMP/notes.md"
          {
            printf '## Build info\n\n'
            printf 'Built with %s on %s, via %s. Signed with a Developer ID and notarized by Apple.\n\n' \
              "$SWIFT" "$OS" "$RUN_URL"
            printf '%s\n\n' "$AUTO_NOTES"
            printf '%s\n' '## Signing with your own Developer ID'
            printf '%s\n' ''
            printf '%s\n' 'To ship under your own organization, build from source: build.sh reads'
            printf '%s\n' 'SIGNING_IDENTITY_APP and SIGNING_IDENTITY_INSTALLER from .env and signs with'
            printf '%s\n' 'whatever identity you give it. See .env.example.'
          } > "$NOTES_FILE"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            gh release create "$TAG" \
              release/ReportMate-*.pkg release/ReportMate-*.pkg.sha256 \
              --target "$GITHUB_SHA" \
              --title "ReportMate $VERSION" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" \
              release/ReportMate-*.pkg release/ReportMate-*.pkg.sha256 \
              --title "ReportMate $VERSION" \
              --notes-file "$NOTES_FILE"
          fi
